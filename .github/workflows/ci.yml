name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # npm audit reports nothing on a pnpm workspace (there is no
      # package-lock.json for it to read), which is how advisories accumulate
      # unseen. pnpm audit exits non-zero on any finding and ignores
      # --audit-level, so the gate lives in a script instead.
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
